name: Validate skill and scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node scripts/test_runtime.mjs
